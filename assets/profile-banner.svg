  <text x="88" y="216" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" letter-spacing="1" font-weight="800">HOUEIDI</text>
  <text x="92" y="260" fill="#c8dcf8" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="1">SOFTWARE DEVELOPER  /  FOUNDER OF ARZWARE</text>
