    <rect x="0" y="0" width="248" height="203" rx="16" fill="#06152d" fill-opacity=".64" stroke="#8fc4ff" stroke-opacity=".26"/>
    <circle cx="21" cy="23" r="5" fill="#fb7185"/><circle cx="39" cy="23" r="5" fill="#fbbf24"/><circle cx="57" cy="23" r="5" fill="#34d399"/>
