    <text x="37" y="116" font-size="18" font-family="Consolas, Monaco, monospace" fill="#94f3d1">build:</text>
    <text x="113" y="116" font-size="18" font-family="Consolas, Monaco, monospace" fill="#ffffff">'useful',</text>
    <text x="37" y="146" font-size="18" font-family="Consolas, Monaco, monospace" fill="#94f3d1">learn:</text>
