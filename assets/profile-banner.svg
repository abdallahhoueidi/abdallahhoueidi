    <radialGradient id="glow"><stop offset="0" stop-color="#3982ee" stop-opacity=".55"/><stop offset="1" stop-color="#3982ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#a7c4f5" stroke-opacity=".07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
